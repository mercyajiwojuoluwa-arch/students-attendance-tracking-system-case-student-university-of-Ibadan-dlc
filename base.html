<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UI DLC Attendance</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f8f6;color:#18372c}header{background:#145a42;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}header a{color:white}main{max-width:1050px;margin:32px auto;padding:0 18px}.card{background:white;padding:22px;border-radius:12px;margin:14px 0;box-shadow:0 2px 10px #0001}a{color:#146b4a}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;text-align:left;padding:11px}button,.btn{background:#145a42;color:white;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;text-decoration:none}input,select{padding:9px;margin:6px;max-width:100%}.msg{background:#e4f4eb;padding:10px}</style></head><body><header><strong>UI DLC | Attendance Tracker</strong><nav><a href="/">Dashboard</a> · <a href="/admin/">Admin</a> · {% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button type="submit">Logout</button></form>{% endif %}</nav></header><main>{% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
